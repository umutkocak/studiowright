[project]
name = "studiowright"
version = "0.2.11"
description = "StudioWright: a fast CLI and MCP server for Google Flow and Google Flow Music. Unofficial; not affiliated with Google."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [{ name = "Umut Koçak" }]
dependencies = [
    "click>=8.5.0",
    "filelock>=4.1.0",
    "mcp[cli]>=2.3.0",
    "pillow>=11.0",
    "platformdirs>=4.12.4",
    "playwright>=1.63.0",
]

[project.scripts]
studiowright = "studiowright.cli:main"
sw = "studiowright.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/studiowright"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
# Flow UI strings in tests and docs include Turkish letters.
allowed-confusables = ["ı"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "ruff>=0.17.0",
]

[tool.ruff.lint.per-file-ignores]
# Spikes embed page JavaScript in long string literals.
"spikes/*" = ["E501"]
